apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-api
  namespace: task-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-api
  template:
    metadata:
      labels:
        app: task-api
    spec:
      containers:
        - name: django
          image: 844171074142.dkr.ecr.us-east-2.amazonaws.com/task-management-backend:latest
          imagePullPolicy: Always

          command:
            - python
            - manage.py
            - runserver
            - 0.0.0.0:8000

          ports:
            - containerPort: 8000

          env:
            - name: DEBUG
              value: "False"

            - name: SECURE_SSL_REDIRECT
              value: "False"

            - name: ALLOWED_HOSTS
              value: "*"

            - name: CORS_ALLOWED_ORIGINS
              value: "http://localhost:5173"

            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: task-api-app-secret
                  key: DJANGO_SECRET_KEY

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: task-api-db-secret
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: task-api-db-secret
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: task-api-db-secret
                  key: DB_PASSWORD

            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: task-api-db-secret
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: task-api-db-secret
                  key: DB_PORT

            - name: CELERY_BROKER_URL
              value: "redis://redis:6379/0"

            - name: CELERY_RESULT_BACKEND
              value: "redis://redis:6379/0"

            - name: EMAIL_HOST
              valueFrom:
                secretKeyRef:
                  name: task-api-email-secret
                  key: EMAIL_HOST

            - name: EMAIL_PORT
              valueFrom:
                secretKeyRef:
                  name: task-api-email-secret
                  key: EMAIL_PORT

            - name: EMAIL_HOST_USER
              valueFrom:
                secretKeyRef:
                  name: task-api-email-secret
                  key: EMAIL_HOST_USER

            - name: EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: task-api-email-secret
                  key: EMAIL_HOST_PASSWORD

            - name: EMAIL_USE_TLS
              valueFrom:
                secretKeyRef:
                  name: task-api-email-secret
                  key: EMAIL_USE_TLS

            - name: DEFAULT_FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: task-api-email-secret
                  key: DEFAULT_FROM_EMAIL

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: task-api
  namespace: task-management
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  selector:
    app: task-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: LoadBalancer