name: CI

on:
  push:
    branches:
      - main
      - master
      - feature/project-completion
  pull_request:
    branches:
      - main
      - master
      
jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: task_api_db
          POSTGRES_USER: task_api_user
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_api_user -d task_api_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        env:
          DEBUG: "True"
          DJANGO_SECRET_KEY: test-secret-key
          DB_NAME: task_api_db
          DB_USER: task_api_user
          DB_PASSWORD: testpassword
          DB_HOST: localhost
          DB_PORT: "5432"
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        run: |
          python manage.py migrate

      - name: Run tests
        env:
          DEBUG: "True"
          DJANGO_SECRET_KEY: test-secret-key
          DB_NAME: task_api_db
          DB_USER: task_api_user
          DB_PASSWORD: testpassword
          DB_HOST: localhost
          DB_PORT: "5432"
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        run: |
          pytest -v
